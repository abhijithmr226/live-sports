<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Krynn Visuals & Stream - Broadcast Watermark</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 24px;
    }
    .watermark-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(14, 18, 27, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 8px;
      color: #ffffff;
      user-select: none;
      animation: floatSubtle 4s ease-in-out infinite alternate;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 12px #ef4444;
      animation: pulseDot 1.5s infinite;
    }
    .title-group {
      display: flex;
      flex-direction: column;
    }
    .title-main {
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title-sub {
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #94a3b8;
    }
    @keyframes pulseDot {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(0.85);
      }
    }
    @keyframes floatSubtle {
      0% {
        transform: translateY(0px);
      }
      100% {
        transform: translateY(-2px);
      }
    }
  </style>
</head>
<body>
  <div class="watermark-badge">
    <div class="live-dot"></div>
    <div class="title-group">
      <span class="title-main">Krynn Visuals &amp; Stream</span>
      <span class="title-sub">Ultra HD Live Broadcast</span>
    </div>
  </div>
</body>
</html>
