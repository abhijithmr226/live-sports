name: Render 24/7 Anti-Sleep Keepalive

on:
  schedule:
    # Trigger every 10 minutes to prevent Render free-tier from idling
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          RENDER_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_APP_URL secret not set. Skipping ping."
            echo "Tip: Add your Render app URL (e.g. https://your-app.onrender.com) to GitHub Repo Secrets as RENDER_APP_URL"
          else
            echo "Pinging $RENDER_URL/api/health..."
            curl -s -f -m 15 "$RENDER_URL/api/health" || echo "Ping dispatched"
          fi
