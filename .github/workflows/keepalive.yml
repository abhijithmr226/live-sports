name: Render 24/7 Anti-Sleep Keepalive

on:
  schedule:
    # Trigger every 10 minutes from GitHub cloud servers to keep Render alive 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow instant manual trigger from GitHub Actions tab

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Send External HTTP Ping to Render
        run: |
          TARGETS=(
            "${{ secrets.RENDER_APP_URL }}"
            "https://live-sports-obs-studio.onrender.com"
            "https://live-sports.onrender.com"
          )

          for URL in "${TARGETS[@]}"; do
            if [ -n "$URL" ]; then
              echo "Pinging $URL/api/health..."
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$URL/api/health" || echo "failed")
              echo "Result for $URL: HTTP $HTTP_CODE"
            fi
          done
          echo "Anti-sleep keepalive run completed."
