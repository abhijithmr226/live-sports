version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudcast_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudcast
      POSTGRES_PASSWORD: cloudcast_secure_password
      POSTGRES_DB: cloudcast_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcast -d cloudcast_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloudcast_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cloudcast_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgresql://cloudcast:cloudcast_secure_password@postgres:5432/cloudcast_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-cloudcast_docker_jwt_production_secret_32_chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      WORKER_ID: cloudcast-docker-worker-01
      MAX_CONCURRENT_JOBS: 4
      PUBLIC_APP_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: cloudcast_worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      WORKER_ID: cloudcast-ffmpeg-worker-01
      MAX_CONCURRENT_JOBS: 4
      API_BASE_URL: http://backend:4000/api

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: cloudcast_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
