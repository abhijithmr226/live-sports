services:
  - type: web
    name: live-sports-obs-studio
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        value: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - key: WORKER_ID
        value: render-cloud-worker-01
      - key: MAX_CONCURRENT_JOBS
        value: "4"
      - key: DATABASE_PATH
        value: ./cloudcast.db
